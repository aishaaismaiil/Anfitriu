<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="UniOrbis: a rede de estudantes do ensino superior em Portugal. Avaliações de cursos e mestrados, debates, comunidades e oportunidades.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%230D1122'/%3E%3Cellipse cx='16' cy='16' rx='14.5' ry='5.5' fill='none' stroke='%233347FF' stroke-width='2.4' transform='rotate(-24 16 16)'/%3E%3Ccircle cx='28.2' cy='11' r='2.6' fill='%23C8F31D'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>UniOrbis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: portal de início dos anos 2000 relido hoje. Calha de navegação à esquerda com o logótipo em órbita,
   coluna central editorial; cada secção tem o seu registo (Ágora = duas colunas pró/contra, Ao vivo = palco escuro,
   Avaliações = dados densos). Cromado e verde-ácido só como sinal, nunca como fundo. */
:root{
  --bg:#F1F2F6; --surface:#FFFFFF; --surface2:#E8EAF1; --ink:#0D1122; --muted:#555B72; --line:#D4D7E2; --line2:#B5BACB;
  --accent:#3347FF; --accent-ink:#FFFFFF; --accent-soft:#E3E6FF; --violet:#6B3DF5; --violet-soft:#ECE5FF;
  --acid:#C8F31D; --acid-ink:#172000; --ok:#13784A; --bad:#C2183C; --warn:#7A5000; --warn-soft:#FFF3D1;
  --stage:#0A0D1A; --stage2:#141932; --stage-ink:#E9ECF7; --stage-muted:#959CBA; --stage-line:#272E4F;
  --chrome:linear-gradient(180deg,#FFFFFF 0%,#C9CDD9 45%,#8E95AB 52%,#E2E5EE 100%);
  --f-disp:"Unbounded","Arial Black","Segoe UI",sans-serif;
  --f-body:"Hanken Grotesk","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0D19; --surface:#11152A; --surface2:#181D36; --ink:#E8EBF5; --muted:#9BA2BE; --line:#252B48; --line2:#343C62;
  --accent:#7383FF; --accent-ink:#0A0D19; --accent-soft:#1D2350; --violet:#A98BFF; --violet-soft:#241D47;
  --acid:#C8F31D; --acid-ink:#172000; --ok:#5ED699; --bad:#FF7090; --warn:#F2C25B; --warn-soft:#2E2610;
  --stage:#05070F; --stage2:#0E1226; --stage-ink:#E9ECF7; --stage-muted:#959CBA; --stage-line:#232A4A;
  --chrome:linear-gradient(180deg,#F4F5F9 0%,#AEB4C6 45%,#6E7590 52%,#C9CEDB 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0D19; --surface:#11152A; --surface2:#181D36; --ink:#E8EBF5; --muted:#9BA2BE; --line:#252B48; --line2:#343C62;
  --accent:#7383FF; --accent-ink:#0A0D19; --accent-soft:#1D2350; --violet:#A98BFF; --violet-soft:#241D47;
  --acid:#C8F31D; --acid-ink:#172000; --ok:#5ED699; --bad:#FF7090; --warn:#F2C25B; --warn-soft:#2E2610;
  --stage:#05070F; --stage2:#0E1226; --stage-ink:#E9ECF7; --stage-muted:#959CBA; --stage-line:#232A4A;
  --chrome:linear-gradient(180deg,#F4F5F9 0%,#AEB4C6 45%,#6E7590 52%,#C9CEDB 100%); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:5rem}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font:700 clamp(2rem,4.6vw,3.4rem)/1.04 var(--f-disp);letter-spacing:-.02em}
h2{font:700 clamp(1.35rem,2.6vw,1.8rem)/1.12 var(--f-disp);letter-spacing:-.015em}
h3{font:700 1.08rem/1.3 var(--f-body)}
h4{font:600 .95rem/1.3 var(--f-body)}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.02em}
.lbl{font:500 .7rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.m{color:var(--muted)}
.sm{font-size:.88rem}
.xs{font-size:.8rem}
.num{font-variant-numeric:tabular-nums}
.wrap{overflow-wrap:anywhere}
.pre{white-space:pre-line}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%;max-width:1440px;margin:0 auto}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:1rem;padding:1.25rem .9rem 1rem max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);overflow-y:auto}
.logo{display:flex;align-items:center;gap:.55rem;color:var(--ink);text-decoration:none;padding:.1rem .35rem}
.logo svg{flex:none}
.logo b{font:700 1.12rem/1 var(--f-disp);letter-spacing:-.02em}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:.65rem;padding:.55rem .6rem;border-radius:var(--r);color:var(--ink);text-decoration:none;font:600 .95rem/1.1 var(--f-body);position:relative}
.nav a .ix{font:500 .66rem/1 var(--f-mono);color:var(--muted);width:1.3rem}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-.9rem;top:.45rem;bottom:.45rem;width:3px;border-radius:2px;background:var(--accent)}
.nav .live-dot{margin-left:auto}
.rail-foot{margin-top:auto;display:grid;gap:.6rem}
.me{display:flex;align-items:center;gap:.55rem;padding:.45rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:600 .88rem var(--f-body);cursor:pointer;text-align:left;width:100%}
.me span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langsel{display:flex;align-items:center;gap:.45rem}
.langsel select{flex:1;min-width:0}
.top{display:none}
.mainwrap{min-width:0;padding-block:1.5rem 3rem;padding-left:clamp(16px,3vw,2.5rem);padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1060px;display:grid;gap:1.75rem}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .top{display:grid;gap:.5rem;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);padding-block:.6rem .4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .row1{display:flex;align-items:center;gap:.6rem}
  .top .row1 .logo{margin-right:auto}
  .top select{width:auto}
  .topnav{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
  .topnav::-webkit-scrollbar{display:none}
  .topnav a{flex:none;padding:.45rem .7rem;border-radius:999px;font:600 .88rem/1 var(--f-body);color:var(--ink);text-decoration:none;border:1px solid transparent}
  .topnav a[aria-current="page"]{border-color:var(--line2);background:var(--bg)}
  .mainwrap{padding-left:max(16px,env(safe-area-inset-left,0px))}
}

/* ---------- blocos ---------- */
.sec-head{display:grid;gap:.5rem}
.crumb{font:500 .74rem/1 var(--f-mono);color:var(--muted);letter-spacing:.02em}
.crumb b{color:var(--accent);font-weight:500}
.lead{font-size:1.08rem;color:var(--muted);max-width:62ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.75rem;align-items:start}
.grid2e{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1.25rem;align-items:start}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:1rem;min-width:0}
.stack-s{display:grid;gap:.5rem;min-width:0}
.row{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.15rem;display:grid;gap:.9rem;min-width:0;align-content:start}
.panel.tight{padding:.85rem .95rem;gap:.65rem}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.hair{border-top:1px dashed var(--line2)}

/* ---------- controlos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:600 .9rem/1 var(--f-body);padding:.66rem 1rem;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.sec:hover{border-color:var(--ink);filter:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:.5rem}
.btn.ghost:hover{color:var(--ink);background:var(--surface2);filter:none}
.btn.s{font-size:.82rem;padding:.45rem .7rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.lnk{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lnk.m{color:var(--muted)}
.fld{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:.55rem .7rem;width:100%;min-width:0}
.fld:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.fld{resize:vertical;line-height:1.45}
label.f{display:grid;gap:.3rem;font:600 .86rem var(--f-body);min-width:0}
label.f small{font-weight:400;color:var(--muted)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:.75rem}
.ck{display:flex;gap:.55rem;align-items:flex-start;font-size:.9rem;color:var(--muted)}
.ck input{margin-top:.2rem}
.msg{font-size:.88rem;font-weight:600;color:var(--ok);min-height:1.2em}
.msg.err{color:var(--bad)}
.tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:600 .9rem var(--f-body);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:.6rem .75rem;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{font:500 .8rem/1.2 var(--f-body);padding:.3rem .6rem;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
span.chip{cursor:default}
.tag{font:500 .75rem/1.2 var(--f-mono);color:var(--muted);padding:.15rem .4rem;border-radius:4px;background:var(--surface2);white-space:nowrap}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.tag.v{background:var(--violet-soft);color:var(--violet)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
button.tag{border:0;cursor:pointer}
.pend{font:500 .75rem/1.2 var(--f-mono);color:var(--warn);background:var(--warn-soft);padding:.1rem .4rem;border-radius:4px;white-space:nowrap}
.note{border-left:3px solid var(--violet);background:var(--violet-soft);padding:.65rem .8rem;border-radius:0 var(--r) var(--r) 0;font-size:.9rem}
.note.w{border-color:var(--warn);background:var(--warn-soft)}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:1.1rem;color:var(--muted);font-size:.92rem;display:grid;gap:.6rem;justify-items:start}
.sample{position:relative;opacity:.92}
.sample::after{content:attr(data-s);position:absolute;top:.5rem;right:.5rem;font:500 .62rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:.25rem .4rem;border-radius:3px}
.live-dot{display:inline-flex;align-items:center;gap:.35rem;font:500 .66rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--acid-ink);background:var(--acid);padding:.25rem .45rem;border-radius:3px}
.live-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acid-ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- identidade ---------- */
.av{display:inline-block;flex:none;border-radius:50%;overflow:hidden;background:var(--surface2);position:relative;vertical-align:middle}
.av svg,.av img{display:block;width:100%;height:100%;object-fit:cover}
.av.sq{border-radius:var(--r)}
.av-pair{position:relative;display:inline-block;flex:none}
.av-pair .av.mini{position:absolute;right:-3px;bottom:-3px;box-shadow:0 0 0 2px var(--surface)}
.who{display:flex;align-items:center;gap:.6rem;min-width:0}
.who > div{min-width:0}
.who b{font-weight:600}
.lvl{font:500 .65rem/1 var(--f-mono);border:1px solid var(--line2);border-radius:3px;padding:.15rem .3rem;color:var(--muted)}

/* ---------- itens ---------- */
.feed{display:grid;list-style:none;margin:0;padding:0}
.post{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.8rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.post:first-child{padding-top:.2rem}
.post .body{display:grid;gap:.45rem;min-width:0}
.post .meta{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.acts{display:flex;gap:.15rem;flex-wrap:wrap;align-items:center;margin-left:-.5rem}
.acts .btn.ghost{font-size:.82rem;padding:.35rem .5rem}
.acts .btn.ghost[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.thread{display:grid;gap:.7rem;border-left:2px solid var(--line);padding-left:.9rem;margin-top:.3rem}
.reply{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.55rem}
.reply.best{background:var(--accent-soft);border-radius:var(--r);padding:.5rem}
.hidden-c{font-size:.88rem;color:var(--muted);font-style:italic}
.compose{display:grid;gap:.6rem}
.compose .types{display:flex;gap:.3rem;flex-wrap:wrap}

/* ---------- avaliações ---------- */
.inst-list{display:grid;gap:0;list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.inst-list li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:1rem;align-items:center;padding:.85rem 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){.inst-list li{grid-template-columns:minmax(0,1fr) auto}.inst-list li .cmp{grid-column:1/-1}}
.score{font:700 1.5rem/1 var(--f-disp);font-variant-numeric:tabular-nums}
.score small{font:500 .7rem var(--f-mono);color:var(--muted);margin-left:.2rem}
.bars{display:grid;gap:.4rem}
.bar{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 2.6rem;gap:.6rem;align-items:center;font-size:.86rem}
@media (max-width:520px){.bar{grid-template-columns:minmax(0,1fr) 2.6rem}.bar .track{grid-column:1/-1;grid-row:2}}
.track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar .num{text-align:right;font-family:var(--f-mono);font-size:.8rem}
.rate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--line)}
.rate .opts{display:flex;gap:2px}
.rate .opts button{width:2rem;height:2rem;font:500 .8rem var(--f-mono);border:1px solid var(--line2);background:var(--surface);color:var(--ink);cursor:pointer}
.rate .opts button:first-child{border-radius:var(--r) 0 0 var(--r)}
.rate .opts button:last-child{border-radius:0 var(--r) var(--r) 0}
.rate .opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rev{display:grid;gap:.5rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.rev .mini-r{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.8rem;color:var(--muted)}
.rev .mini-r b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.tray{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:.6rem .8rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tray .btn{border-color:var(--bg)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:620px}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font:500 .72rem var(--f-mono);letter-spacing:.04em;color:var(--muted);background:var(--surface2)}
tbody th{font-weight:600;font-size:.86rem;white-space:nowrap}
tr.grp th{font:500 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--bg);color:var(--muted)}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}

/* ---------- ágora ---------- */
.dlist{display:grid;list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.dlist li{padding:1.1rem 0;border-bottom:1px solid var(--line);display:grid;gap:.5rem;cursor:pointer}
.dlist li:hover h3{color:var(--accent)}
.split{height:4px;display:flex;border-radius:2px;overflow:hidden;background:var(--surface2);max-width:320px}
.split i{display:block;height:100%}
.split .p{background:var(--accent)}
.split .c{background:var(--violet)}
.motion{font:700 clamp(1.5rem,3.4vw,2.4rem)/1.12 var(--f-disp);letter-spacing:-.02em;max-width:26ch}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;align-items:start}
@media (max-width:760px){.sides{grid-template-columns:minmax(0,1fr)}.sides .side-tabs{display:flex}.sides .col[data-hide="1"]{display:none}}
.side-tabs{display:none;grid-column:1/-1;gap:.4rem}
.col{display:grid;gap:.75rem;min-width:0}
.col-h{display:flex;align-items:center;gap:.5rem;border-bottom:2px solid currentColor;padding-bottom:.4rem;font:700 .95rem var(--f-disp)}
.col.pro .col-h{color:var(--accent)}
.col.con .col-h{color:var(--violet)}
.arg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.8rem .85rem;display:grid;gap:.5rem}
.arg.strong{box-shadow:inset 3px 0 0 var(--acid)}
.arg .src{font-size:.82rem}
.counter{margin-left:.6rem;border-left:2px solid var(--line2);padding-left:.7rem;display:grid;gap:.5rem}
.poll{display:grid;gap:.45rem}
.poll button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;text-align:left;font:500 .92rem var(--f-body);border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:.55rem .7rem;cursor:pointer;position:relative;overflow:hidden}
.poll button i{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);z-index:0}
.poll button span{position:relative;z-index:1}
.poll button[aria-pressed="true"]{border-color:var(--accent)}

/* ---------- ao vivo ---------- */
.stage{background:var(--stage);color:var(--stage-ink);border-radius:var(--r);padding:1.1rem;display:grid;gap:1rem;--line:var(--stage-line);--muted:var(--stage-muted);--surface:var(--stage2);--surface2:#1A2040;--ink:var(--stage-ink);--line2:#323A62}
.stage a{color:#9EAAFF}
.stage .fld{background:var(--stage2);color:var(--stage-ink);border-color:var(--stage-line)}
.stage .btn.sec{background:var(--stage2);color:var(--stage-ink);border-color:var(--stage-line)}
.stage-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:1rem;align-items:start}

/* ===== Tema v2: cor por secção, contornos a tinta e sombras duras ===== */
:root{
  --bg:#ECEBFF; --surface:#FFFFFF; --surface2:#F4F3FF; --edge:#0D1122; --line:#D9D8F0; --line2:#B9B8DA;
  --c-inicio:#3347FF; --c-mural:#3347FF; --c-msg:#00A3FF; --c-com:#FF4FA0; --c-expl:#00B894; --c-aval:#FF6B3D; --c-opo:#FFB800; --c-skills:#00C2A8; --c-deb:#6B3DF5; --c-live:#C8F31D; --c-agenda:#00A3FF; --c-esp:#6B3DF5;
  --blob1:#C9D0FF; --blob2:#F1D2FF; --blob3:#D8F7B0;

}

  --bg:#0A0C22; --surface:#141838; --surface2:#1B2046; --edge:#5F68B8; --line:#262C57; --line2:#39407A;
  --blob1:#1C2A7A; --blob2:#3A1E6E; --blob3:#1F3A1E; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0C22; --surface:#141838; --surface2:#1B2046; --edge:#5F68B8; --line:#262C57; --line2:#39407A; --blob1:#1C2A7A; --blob2:#3A1E6E; --blob3:#1F3A1E; color-scheme:dark}
body{background-color:var(--bg);background-image:radial-gradient(circle at 12% 8%,var(--blob1),transparent 38%),radial-gradient(circle at 88% 18%,var(--blob2),transparent 36%),radial-gradient(circle at 70% 92%,var(--blob3),transparent 34%),radial-gradient(var(--line2) 1px,transparent 1.4px);background-size:100% 100%,100% 100%,100% 100%,22px 22px;background-attachment:fixed}
main[data-v="inicio"]{--sec:var(--c-inicio)} main[data-v="mural"]{--sec:var(--c-mural)} main[data-v="mensagens"]{--sec:var(--c-msg)}
main[data-v="comunidades"]{--sec:var(--c-com)} main[data-v="explorar"]{--sec:var(--c-expl);--sec-ink:#0D1122} main[data-v="avaliacoes"]{--sec:var(--c-aval);--sec-ink:#0D1122}
main[data-v="oportunidades"]{--sec:var(--c-opo);--sec-ink:#0D1122} main[data-v="skills"]{--sec:var(--c-skills);--sec-ink:#0D1122} main[data-v="agora"]{--sec:var(--c-deb)}

/* calha */

.nav a[aria-current="page"]{background:var(--c);color:var(--ci,#fff);border-color:var(--edge);box-shadow:3px 3px 0 var(--edge)}
.nav a[aria-current="page"]::before{display:none}
.nav a[aria-current="page"] .dot{background:#fff}
.nav a .badge-n{margin-left:auto;font:600 .7rem var(--f-mono);background:var(--bad);color:#fff;border-radius:999px;padding:.1rem .4rem}
.top{border-bottom:1.5px solid var(--edge)}

/* cabeçalho de secção: faixa de cor */
.banner{position:relative;overflow:hidden;background:var(--sec);color:var(--sec-ink);border:1.5px solid var(--edge);border-radius:14px;box-shadow:5px 5px 0 var(--edge);padding:1.25rem 1.4rem;display:grid;gap:.45rem}

/* caixas */
.panel{border:1.5px solid var(--edge);border-radius:12px;box-shadow:4px 4px 0 var(--sec)}

.arg{border:1.5px solid var(--edge);border-radius:10px}

.btn{border:1.5px solid var(--edge);background:var(--sec);color:var(--sec-ink);box-shadow:3px 3px 0 var(--edge);border-radius:10px;font-weight:700;transition:transform .08s,box-shadow .08s}

.side-mod .ph .lbl{color:var(--ink);font-weight:600}
.stage{border:1.5px solid var(--edge);box-shadow:5px 5px 0 var(--c-live);border-radius:14px}

.score{color:var(--ink)}

.xp{height:12px;border:1.5px solid var(--edge);border-radius:999px}

.medal{width:30px;height:30px}
/* editor de avatar v2 */
.opts{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.opt{aspect-ratio:auto;display:grid;gap:3px;padding:4px;border:1.5px solid var(--edge);border-radius:12px;background:var(--surface)}

.opt .optname{font:600 .66rem/1.15 var(--f-body);text-align:center;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

:root{--c-sinais:#FF3D7F;--c-diario:#D84DFF}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* =====================================================================
   UniOrbis — ligação ao Supabase.
   Implementa a mesma interface que o site já usa (claude.use("db"),
   "user", "room", "downloads"), por isso o resto do código não muda.
   ===================================================================== */
(function(){
  "use strict";
  var C=window.UO_CONFIG||{};
  var configured=!!(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&!/COLA_AQUI/.test(C.SUPABASE_URL+C.SUPABASE_ANON_KEY));
  var sb=null,session=null;
  if(configured&&window.supabase&&window.supabase.createClient){
    sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},realtime:{params:{eventsPerSecond:20}}});
  }
  var booted=false,bootUid=null;
  function uidOf(x){return x&&x.user?x.user.id:null}
  var ready=(sb?sb.auth.getSession().then(function(r){session=r&&r.data?r.data.session:null}).catch(function(){}):Promise.resolve()).then(function(){bootUid=uidOf(session);booted=true});
  /* Só recarrega se a conta mudar DEPOIS do arranque (ex.: entraste ou saíste noutra aba).
     Eventos do próprio arranque e de renovação do token não recarregam. */
  if(sb)sb.auth.onAuthStateChange(function(ev,s){session=s;if(!booted)return;var u=uidOf(s);if(u===bootUid)return;
    var k="uo_reload_guard",n=0;try{n=+(sessionStorage.getItem(k)||0)}catch(e){}
    if(n>2)return;try{sessionStorage.setItem(k,String(n+1));setTimeout(function(){try{sessionStorage.removeItem(k)}catch(e){}},10000)}catch(e){}
    bootUid=u;location.reload()});

  function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
  function parentOf(path){return path.slice(0,path.lastIndexOf("/"))}
  function clone(x){return x==null?x:JSON.parse(JSON.stringify(x))}
  function E(code,msg){return{code:code,message:msg||code}}
  function mapErr(e){if(!e)return E("unavailable");var m=String(e.message||"")+" "+String(e.code||"");if(/row-level security|permission|42501|violates/i.test(m))return E("invalid_argument",m);if(/quota|limit|too large|413/i.test(m))return E("quota_exceeded",m);return E("unavailable",m)}

  /* ---------- tempo real: um só canal, distribuído por coleção ---------- */
  var listeners={},rtChannel=null;
  function ensureRealtime(){if(rtChannel||!sb)return;
    rtChannel=sb.channel("docs-all").on("postgres_changes",{event:"*",schema:"public",table:"docs"},function(p){
      var c=(p.new&&p.new.collection)||(p.old&&p.old.collection);
      if(c&&listeners[c])listeners[c].forEach(function(fn){fn()});
      if(!c)Object.keys(listeners).forEach(function(k){listeners[k].forEach(function(fn){fn()})});
    }).subscribe()}
  function fetchColl(c){return sb.from("docs").select("path,data").eq("collection",c).then(function(r){if(r.error)throw mapErr(r.error);return(r.data||[]).map(function(x){return{id:x.path.slice(c.length+1),data:x.data||{}}})})}
  function snap(rows,q){var L=rows.slice();
    if(q.ord){var f=q.ord[0],d=q.ord[1]==="desc"?-1:1;L.sort(function(a,b){var x=a.data[f],y=b.data[f];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return(x>y?1:x<y?-1:0)*d})}
    if(q.lim)L=L.slice(0,q.lim);
    return{size:L.length,docs:L.map(function(r){return{id:r.id,exists:true,data:function(){return clone(r.data)}}})}}
  function Query(c,q){q=q||{};return{
    path:c,
    orderBy:function(f,d){return Query(c,{ord:[f,d||"asc"],lim:q.lim})},
    limit:function(n){return Query(c,{ord:q.ord,lim:n})},
    doc:function(id){return Doc(c+"/"+id)},
    add:function(data){var id=rid();return Doc(c+"/"+id).set(data).then(function(){return Doc(c+"/"+id)})},
    get:function(){return fetchColl(c).then(function(rows){return snap(rows,q)})},
    onSnapshot:function(cb,onErr){var alive=true,t=null;
      function load(){fetchColl(c).then(function(rows){if(alive)cb(snap(rows,q))}).catch(function(e){if(alive&&onErr&&e&&e.code!=="unavailable")onErr(e)})}
      function soon(){clearTimeout(t);t=setTimeout(load,150)}
      ensureRealtime();(listeners[c]=listeners[c]||[]).push(soon);load();
      var iv=setInterval(load,60000);
      return function(){alive=false;clearInterval(iv);listeners[c]=(listeners[c]||[]).filter(function(f){return f!==soon})}}
  }}
  function Doc(path){return{id:path.split("/").pop(),path:path,
    collection:function(n){return Query(path+"/"+n)},
    get:function(){return sb.from("docs").select("data").eq("path",path).maybeSingle().then(function(r){if(r.error)throw mapErr(r.error);var d=r.data;return{exists:!!d,id:path.split("/").pop(),data:function(){return d?clone(d.data):undefined}}})},
    set:function(data){return sb.from("docs").upsert({path:path,collection:parentOf(path),data:clone(data)},{onConflict:"path"}).then(function(r){if(r.error)throw mapErr(r.error);bump(parentOf(path))})},
    update:function(data){return sb.rpc("doc_merge",{p_path:path,p_patch:clone(data)}).then(function(r){if(r.error)throw mapErr(r.error);if(!r.data)throw E("invalid_argument","not found");bump(parentOf(path))})},
    "delete":function(){return sb.from("docs").delete().eq("path",path).then(function(r){if(r.error)throw mapErr(r.error);bump(parentOf(path))})}
  }}
  /* atualiza logo quem escreveu, sem esperar pelo tempo real */
  function bump(c){if(listeners[c])listeners[c].forEach(function(fn){fn()})}
  var db={doc:Doc,collection:function(c){return Query(c)}};

  /* ---------- utilizador ---------- */
  var adminCache=null;
  var user={
    id:function(){return Promise.resolve(session&&session.user?session.user.id:null)},
    me:function(){return Promise.resolve({id:session&&session.user?session.user.id:null,email:session&&session.user?session.user.email:null,name:""})},
    isOwner:function(){if(adminCache!==null)return Promise.resolve(adminCache);return sb.rpc("is_admin").then(function(r){adminCache=!!(r&&r.data);return adminCache}).catch(function(){return false})},
    canEdit:function(){return user.isOwner()},
    can:function(){return Promise.resolve(!!session)},
    profiles:function(){return Promise.resolve({})}
  };

  /* ---------- presença e salas ao vivo (Supabase Realtime) ---------- */
  var myPeer=rid();
  function makeRoom(name){
    var ch=sb.channel("room-"+name,{config:{presence:{key:myPeer},broadcast:{self:true}}}),state={},peerCbs=[],topicCbs={},list=[],subscribed=false,pending=null;
    function rebuild(){var ps=ch.presenceState(),out=[];Object.keys(ps).forEach(function(k){var m=ps[k][ps[k].length-1]||{};out.push({peer:k,by:m.uid||null,isMe:k===myPeer,sameTab:k===myPeer,kind:"viewer",guest:false,presence:m.presence||{},updatedAt:Date.now()})});list=out;peerCbs.forEach(function(cb){try{cb({peers:list,joined:[],left:[],updated:[]})}catch(e){}})}
    ch.on("presence",{event:"sync"},rebuild);
    ch.on("broadcast",{event:"*"},function(msg){var cbs=topicCbs[msg.event]||[];cbs.forEach(function(cb){cb({topic:msg.event,data:msg.payload,peer:(msg.payload&&msg.payload.__peer)||"",by:null,isMe:msg.payload&&msg.payload.__peer===myPeer,sameTab:false,kind:"viewer",guest:false})})});
    ch.subscribe(function(st){if(st==="SUBSCRIBED"){subscribed=true;ch.track({uid:session.user.id,presence:state});if(pending){pending();pending=null}}});
    return{
      presence:function(patch){Object.keys(patch||{}).forEach(function(k){if(patch[k]===null)delete state[k];else state[k]=patch[k]});if(subscribed)return ch.track({uid:session.user.id,presence:state});return Promise.resolve()},
      onPeers:function(cb){peerCbs.push(cb);setTimeout(rebuild,0);return function(){peerCbs=peerCbs.filter(function(x){return x!==cb})}},
      peers:function(){return list},
      on:function(topic,cb){(topicCbs[topic]=topicCbs[topic]||[]).push(cb);return function(){topicCbs[topic]=(topicCbs[topic]||[]).filter(function(x){return x!==cb})}},
      emit:function(topic,data){var p=Object.assign({},data||{},{__peer:myPeer});return ch.send({type:"broadcast",event:topic,payload:p}).then(function(){})},
      join:function(n){return makeRoom(name+"--"+n)},
      leave:function(){try{sb.removeChannel(ch)}catch(e){}}
    }}

  /* ---------- descargas ---------- */
  var downloads={save:function(o){try{var blob=o.data instanceof Blob?o.data:new Blob([o.data]);var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=o.filename||"ficheiro";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);return Promise.resolve()}catch(e){return Promise.reject(E("unavailable"))}}};

  var roomInst=null;
  window.claude={use:function(name){return ready.then(function(){
    if(name==="downloads")return downloads;
    if(!sb||!session)return null;
    if(name==="db")return db;
    if(name==="user")return user;
    if(name==="room"){if(!roomInst)roomInst=makeRoom("lobby");return roomInst}
    return null})}};
  window.UO_AUTH={
    configured:configured,
    signIn:function(email){if(!sb)return Promise.reject(E("unavailable","Falta configurar o Supabase em config.js"));return sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.origin+location.pathname}}).then(function(r){if(r.error)throw r.error})},
    signOut:function(){return sb?sb.auth.signOut():Promise.resolve()},
    email:function(){return session&&session.user?session.user.email:null}
  };
})();

</script>

function endT(h,min){var p=h.split(":"),m=+p[0]*60+(+p[1])+(min||60);if(m>=1440)m=1439;return pad(Math.floor(m/60))+":"+pad(m%60)}

function ics(list){var o=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//UniOrbis//PT","CALSCALE:GREGORIAN"],st=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  list.forEach(function(e,i){var d=e.data.replace(/-/g,"");o.push("BEGIN:VEVENT","UID:"+String(e.id||i).replace(/[^\w-]/g,"")+"-"+d+"@uniorbis","DTSTAMP:"+st);
    if(e.hora)o.push("DTSTART;TZID=Europe/Lisbon:"+d+"T"+e.hora.replace(":","")+"00","DTEND;TZID=Europe/Lisbon:"+d+"T"+endT(e.hora,e.dur).replace(":","")+"00");else o.push("DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+nextDay(e.data).replace(/-/g,""));

function liveStart(l){return isDate(l.data)&&/^\d{2}:\d{2}$/.test(l.hora||"")?new Date(l.data+"T"+l.hora+":00"):null}
function liveEnd(l){var s=liveStart(l);return s?new Date(s.getTime()+(+l.dur||60)*60000):null}

function modQueue(){var Q=[];function add(list,path,kind,title){list.forEach(function(x){if(repN(x))Q.push({p:path+x.id,x:x,kind:kind,title:title(x)})})}
  add(POSTS,"posts/","Publicação",function(x){return x.tit||String(x.txt).slice(0,90)});add(REVS,"avaliacoes/","Avaliação",function(x){return targetName(x.alvo)+" · "+String(x.txt).slice(0,80)});add(DEBS,"debates/","Debate",function(x){return x.tit});add(OPOS,"oportunidades/","Oportunidade",function(x){return x.tit});add(COMS,"comunidades/","Comunidade",function(x){return x.nome});add(TEMAS,"temas/","Tema",function(x){return x.txt});add(LIVES,"live/","Debate ao vivo",function(x){return x.tit});add(EVS,"eventos/","Atividade",function(x){return x.titulo});add(INSTX,"instituicoes/","Instituição",function(x){return x.nome});add(PROGS,"programas/","Curso",function(x){return x.nome});
  Object.keys(ARGS).forEach(function(d){add(arr(ARGS[d]),"debates/"+d+"/args/","Argumento",function(x){return String(x.txt).slice(0,90)})});
  var byA={};DENUN.forEach(function(d){var a=byA[d.alvo]||(byA[d.alvo]={rep:{},ids:[]});a.rep[d.uid]=d.motivo;a.ids.push(d.id)});
  Object.keys(byA).forEach(function(al){var u=al.split("/")[1];Q.push({p:al,x:{id:u,uid:u,rep:byA[al].rep},kind:"Perfil",title:nameOf(u),den:byA[al].ids})});
  return Q.sort(function(a,b){return repN(b.x)-repN(a.x)})}

document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");if(g){e.preventDefault();closeDetailSubs();go(g.getAttribute("data-go"));return}
  var a=e.target.closest("[data-a]");if(!a||a.tagName==="INPUT")return;var fn=ACT[a.getAttribute("data-a")];if(!fn)return;e.preventDefault();
  var d={};[].forEach.call(a.attributes,function(at){if(at.name.indexOf("data-")===0)d[at.name.slice(5)]=at.value});fn(d,a);
});

document.addEventListener("change",function(e){var el=e.target;
  if(el.id==="langPick"||el.id==="langPick2"){L=el.value;ls("uo.lang",L);TXT={};render();return}
  if(el.id==="fotoIn"){readFoto(el.files&&el.files[0]);return}

  if(el.id==="rv-alvo"){RV.alvo=el.value;var mine=REVS.filter(function(r){return r.alvo===el.value&&r.uid===UID})[0];if(mine)RV.notas=Object.assign({},obj(mine.notas));render();return}
  if(el.id==="ob-meta"){OBJ.meta=el.value;saveObj();return}
  var a=el.getAttribute("data-a");if(a&&CHANGE[a]){CHANGE[a](el);return}
  var fl=el.getAttribute("data-flt");if(fl&&el.tagName==="SELECT"){F[fl]=el.value;render()}
});

function readFoto(file){if(!file)return;if(!/^image\//.test(file.type)){setMsg("foto-msg",t("Escolhe uma imagem (JPG ou PNG)."),true);return}
  var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var c=document.createElement("canvas"),S=192;c.width=S;c.height=S;var s=Math.min(img.width,img.height),g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,S,S);g.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S,S);
    var q=.85,u=c.toDataURL("image/jpeg",q);while(u.length>70000&&q>.4){q-=.15;u=c.toDataURL("image/jpeg",q)}FOTO=u;if(MYP&&(!MYP.disp||MYP.disp==="avatar"))F.disp="ambos";render();setTimeout(function(){setMsg("foto-msg",t("Foto pronta. Guarda o perfil para a publicar."))},30)};
    img.onerror=function(){setMsg("foto-msg",t("Não foi possível ler esta imagem."),true)};img.src=r.result};r.readAsDataURL(file)}

/* ---------- a tua órbita animada ---------- */
function orbitViz(list,size,demo){
  size=size||300;var c=size/2,rings=[size*.3,size*.46],me=demo?avSeed("tour-me"):(DRAFT_AV||avOf(UID));
  var h='<div class="orbitv" style="width:'+size+'px;height:'+size+'px;max-width:100%">';
  rings.forEach(function(r){h+='<span class="ring" style="width:'+r*2+'px;height:'+r*2+'px;left:'+(c-r)+'px;top:'+(c-r)+'px"></span>'});
  h+='<span class="core" style="width:'+size*.26+'px;height:'+size*.26+'px;left:'+(c-size*.13)+'px;top:'+(c-size*.13)+'px">'+(demo?'<span class="av" style="width:100%;height:100%">'+avatarSVG(me)+'</span>':ident(UID,Math.round(size*.26)))+'</span>';
  [0,1].forEach(function(ri){var items=list.filter(function(x,i){return i%2===ri}),r=rings[ri],dur=ri?90:60;if(!items.length)return;

 "São só cinco toques. As tuas notas aparecem logo na página do curso e da instituição.":["It's just five taps. Your ratings show up right away on the course and institution pages.","Son solo cinco toques. Tus notas aparecen enseguida en la página del curso y de la institución.","Nur fünf Klicks. Deine Noten erscheinen sofort auf der Seite des Studiengangs und der Hochschule.","Cinq touches seulement. Tes notes apparaissent tout de suite sur la page de la formation et de l'établissement.","Solo cinque tocchi. I tuoi voti compaiono subito nella pagina del corso e dell'istituzione."],

 "Se não quiseres mostrar a cara, escolhe Só o avatar. O resto do perfil fica visível para toda a gente poder encontrar-te e aprender contigo.":["If you don't want to show your face, choose Avatar only. The rest of your profile stays visible so everyone can find you and learn from you.","Si no quieres mostrar la cara, elige Solo el avatar. El resto del perfil queda visible para que todos puedan encontrarte y aprender contigo.","Wenn du dein Gesicht nicht zeigen willst, wähle Nur Avatar. Der Rest deines Profils bleibt sichtbar, damit alle dich finden und von dir lernen können.","Si tu ne veux pas montrer ton visage, choisis Avatar seulement. Le reste du profil reste visible pour que tout le monde puisse te trouver et apprendre avec toi.","Se non vuoi mostrare il viso, scegli Solo l'avatar. Il resto del profilo resta visibile perché tutti possano trovarti e imparare da te."],
 "Quem és":["Who you are","Quién eres","Wer du bist","Qui tu es","Chi sei"],
 "Tudo o que pões aqui fica visível para os membros. É isso que permite encontrar quem te pode ajudar e quem tem coisas em comum contigo.":["Everything here is visible to members. That's what lets you find people who can help you and who have things in common with you.","Todo lo que pones aquí es visible para los miembros. Eso permite encontrar a quien te puede ayudar y a quien tiene cosas en común contigo.","Alles hier ist für Mitglieder sichtbar. So findest du Leute, die dir helfen können und Gemeinsamkeiten mit dir haben.","Tout ce que tu mets ici est visible des membres. C'est ce qui permet de trouver qui peut t'aider et qui a des points communs avec toi.","Tutto ciò che metti qui è visibile ai membri. È così che trovi chi può aiutarti e chi ha cose in comune con te."],

 "{n} cursos desta instituição na lista. Se o teu não aparecer, escreve o nome: fica adicionado.":["{n} courses from this institution on the list. If yours isn't there, type the name and it will be added.","{n} cursos de esta institución en la lista. Si el tuyo no aparece, escribe el nombre y se añadirá.","{n} Studiengänge dieser Hochschule in der Liste. Wenn deiner fehlt, tipp den Namen ein, dann wird er hinzugefügt.","{n} formations de cet établissement dans la liste. Si la tienne n'y est pas, écris son nom : elle sera ajoutée.","{n} corsi di questa istituzione nella lista. Se il tuo non c'è, scrivi il nome: verrà aggiunto."],
 "Notas rápidas":["Quick ratings","Notas rápidas","Schnellbewertung","Notes rapides","Voti rapidi"],
 "Obrigatório. De 1 (muito mau) a 5 (excelente). Aparecem sem o teu nome na página do curso e da instituição, e ajudam quem está a escolher.":["Required. From 1 (very poor) to 5 (excellent). They appear without your name on the course and institution pages and help people choosing.","Obligatorio. De 1 (muy malo) a 5 (excelente). Aparecen sin tu nombre en la página del curso y de la institución, y ayudan a quien está eligiendo.","Pflicht. Von 1 (sehr schlecht) bis 5 (ausgezeichnet). Sie erscheinen ohne deinen Namen auf der Seite des Studiengangs und der Hochschule und helfen bei der Wahl.","Obligatoire. De 1 (très mauvais) à 5 (excellent). Elles apparaissent sans ton nom sur la page de la formation et de l'établissement et aident ceux qui choisissent.","Obbligatorio. Da 1 (pessimo) a 5 (eccellente). Compaiono senza il tuo nome nella pagina del corso e dell'istituzione e aiutano chi sta scegliendo."],

 "Aceito que o meu perfil fique visível aos membros da UniOrbis. Posso apagá-lo quando quiser.":["I agree that my profile is visible to UniOrbis members. I can delete it at any time.","Acepto que mi perfil sea visible para los miembros de UniOrbis. Puedo borrarlo cuando quiera.","Ich bin einverstanden, dass mein Profil für UniOrbis-Mitglieder sichtbar ist. Ich kann es jederzeit löschen.","J'accepte que mon profil soit visible des membres d'UniOrbis. Je peux le supprimer quand je veux.","Accetto che il mio profilo sia visibile ai membri di UniOrbis. Posso eliminarlo quando voglio."],
 "Confirma que aceitas mostrar o perfil.":["Confirm that you agree to show your profile.","Confirma que aceptas mostrar el perfil.","Bestätige, dass du dein Profil zeigen möchtest.","Confirme que tu acceptes de montrer ton profil.","Conferma che accetti di mostrare il profilo."],
 "Faltam notas rápidas: dá uma nota de 1 a 5 a cada linha do teu curso e à experiência geral da instituição.":["Quick ratings missing: give a score from 1 to 5 to each line for your course and to the institution's overall experience.","Faltan notas rápidas: da una nota de 1 a 5 a cada línea de tu curso y a la experiencia general de la institución.","Schnellbewertung fehlt: Gib jeder Zeile für deinen Studiengang und dem Gesamteindruck der Hochschule 1 bis 5.","Il manque des notes rapides : donne une note de 1 à 5 à chaque ligne de ta formation et à l'expérience générale de l'établissement.","Mancano voti rapidi: dai un voto da 1 a 5 a ogni riga del tuo corso e all'esperienza generale dell'istituzione."],

 "Perfil guardado. Obrigado pelas notas!":["Profile saved. Thanks for the ratings!","Perfil guardado. ¡Gracias por las notas!","Profil gespeichert. Danke für die Bewertung!","Profil enregistré. Merci pour les notes !","Profilo salvato. Grazie per i voti!"],
 "Esta pessoa só recebe mensagens da sua órbita. Pede para entrar na órbita dela primeiro.":["This person only gets messages from their orbit. Ask to join their orbit first.","Esta persona solo recibe mensajes de su órbita. Pide entrar en su órbita primero.","Diese Person bekommt nur Nachrichten aus ihrem Orbit. Frag zuerst, ob du in ihren Orbit darfst.","Cette personne ne reçoit des messages que de son orbite. Demande d'abord à rejoindre son orbite.","Questa persona riceve messaggi solo dalla sua orbita. Chiedi prima di entrare nella sua orbita."],
 "O teu perfil é visível para os membros: nome, instituição, curso, interesses, o que sabes e o que queres aprender. É assim que as pessoas te encontram.":["Your profile is visible to members: name, institution, course, interests, what you know and what you want to learn. That's how people find you.","Tu perfil es visible para los miembros: nombre, institución, curso, intereses, lo que sabes y lo que quieres aprender. Así te encuentra la gente.","Dein Profil ist für Mitglieder sichtbar: Name, Hochschule, Studiengang, Interessen, was du kannst und lernen willst. So finden dich die Leute.","Ton profil est visible des membres : nom, établissement, formation, intérêts, ce que tu sais et ce que tu veux apprendre. C'est comme ça qu'on te trouve.","Il tuo profilo è visibile ai membri: nome, istituzione, corso, interessi, ciò che sai e ciò che vuoi imparare. È così che le persone ti trovano."],
 "Se não quiseres mostrar a cara, escolhe Só o avatar em Perfil.":["If you don't want to show your face, choose Avatar only in Profile.","Si no quieres mostrar la cara, elige Solo el avatar en Perfil.","Wenn du dein Gesicht nicht zeigen willst, wähle unter Profil Nur Avatar.","Si tu ne veux pas montrer ton visage, choisis Avatar seulement dans Profil.","Se non vuoi mostrare il viso, scegli Solo l'avatar in Profilo."],
 "O contacto pode ficar só para ti, ou visível à tua órbita e a quem fizer uma troca contigo.":["Your contact can stay private, or be visible to your orbit and people who swap with you.","El contacto puede quedar solo para ti, o visible para tu órbita y quien haga un intercambio contigo.","Dein Kontakt kann privat bleiben oder für deinen Orbit und Tauschpartner sichtbar sein.","Le contact peut rester privé, ou visible à ton orbite et à ceux qui font un échange avec toi.","Il contatto può restare privato o essere visibile alla tua orbita e a chi fa uno scambio con te."],
 "As notas rápidas e as avaliações anónimas não mostram o teu nome. A moderação consegue ver a autoria.":["Quick ratings and anonymous reviews don't show your name. Moderators can see who wrote them.","Las notas rápidas y las reseñas anónimas no muestran tu nombre. La moderación puede ver la autoría.","Schnellbewertungen und anonyme Bewertungen zeigen deinen Namen nicht. Die Moderation sieht, wer sie geschrieben hat.","Les notes rapides et les avis anonymes ne montrent pas ton nom. La modération peut voir l'auteur.","I voti rapidi e le recensioni anonime non mostrano il tuo nome. La moderazione può vedere l'autore."],
 "As mensagens diretas só são lidas pelas duas pessoas da conversa. Escolhes quem te pode escrever.":["Direct messages are only read by the two people in the chat. You choose who can write to you.","Los mensajes directos solo los leen las dos personas de la conversación. Eliges quién te puede escribir.","Direktnachrichten lesen nur die beiden Personen im Chat. Du wählst, wer dir schreiben darf.","Les messages directs ne sont lus que par les deux personnes de la conversation. Tu choisis qui peut t'écrire.","I messaggi diretti li leggono solo le due persone della conversazione. Scegli tu chi può scriverti."],

 "O prazo normal terminou a 2 de outubro de 2026. Até 31 de maio de 2027 ainda podes candidatar-te; a bolsa conta a partir do mês seguinte. Candidatura na plataforma BeOn da DGES.":["The normal deadline was 2 October 2026. You can still apply until 31 May 2027; the grant counts from the following month. Apply on the DGES BeOn platform.","El plazo normal terminó el 2 de octubre de 2026. Hasta el 31 de mayo de 2027 aún puedes solicitarla; la beca cuenta desde el mes siguiente. Solicitud en la plataforma BeOn de la DGES.","Die reguläre Frist endete am 2. Oktober 2026. Bis 31. Mai 2027 kannst du dich noch bewerben; das Stipendium gilt ab dem Folgemonat. Antrag über die DGES-Plattform BeOn.","Le délai normal s'est terminé le 2 octobre 2026. Tu peux encore postuler jusqu'au 31 mai 2027 ; la bourse compte à partir du mois suivant. Candidature sur la plateforme BeOn de la DGES.","Il termine normale è scaduto il 2 ottobre 2026. Puoi ancora fare domanda fino al 31 maggio 2027; la borsa vale dal mese successivo. Domanda sulla piattaforma BeOn della DGES."],

 "Nos últimos anos o prazo foi a 15 de janeiro. Confirma a data deste ano no site oficial.":["In recent years the deadline was 15 January. Check this year's date on the official site.","En los últimos años el plazo fue el 15 de enero. Confirma la fecha de este año en la web oficial.","In den letzten Jahren war die Frist der 15. Januar. Prüfe das diesjährige Datum auf der offiziellen Seite.","Ces dernières années, la date limite était le 15 janvier. Vérifie la date de cette année sur le site officiel.","Negli ultimi anni la scadenza è stata il 15 gennaio. Controlla la data di quest'anno sul sito ufficiale."],
 "Bolsas Fulbright para estudantes portugueses 2027/2028 (previsto)":["Fulbright grants for Portuguese students 2027/2028 (expected)","Becas Fulbright para estudiantes portugueses 2027/2028 (previsto)","Fulbright-Stipendien für portugiesische Studierende 2027/2028 (voraussichtlich)","Bourses Fulbright pour étudiants portugais 2027/2028 (prévu)","Borse Fulbright per studenti portoghesi 2027/2028 (previsto)"],
 "Em 2026 o prazo foi a 15 de janeiro, com abertura em novembro. Confirma no site da Comissão Fulbright.":["In 2026 the deadline was 15 January, opening in November. Check the Fulbright Commission site.","En 2026 el plazo fue el 15 de enero, con apertura en noviembre. Confirma en la web de la Comisión Fulbright.","2026 war die Frist der 15. Januar, Start im November. Prüfe die Seite der Fulbright-Kommission.","En 2026, la date limite était le 15 janvier, avec ouverture en novembre. Vérifie sur le site de la Commission Fulbright.","Nel 2026 la scadenza è stata il 15 gennaio, con apertura a novembre. Controlla sul sito della Commissione Fulbright."],
